<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - SpaceSync</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<style>
    /* Reset some default browser styles */
body, h1, h2, h3, p, ul {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

/* Header Styles */
header {
    background-color: #333;
    color: #fff;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
}

.logo {
    font-size: 36px;
}

.nav-links {
    list-style: none;
    display: flex;
}

.nav-links li {
    margin-left: 20px;
}

.nav-links a {
    text-decoration: none;
    color: #fff;
    font-weight: bold;
    transition: color 0.3s;
}

.nav-links a:hover {
    color: #ff8c00;
}

/* My Account Section Styles */
.my-account {
    padding: 80px 0;
}

.account-card {
    background-color: #fff;
    border-radius: 10px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
}

.account-avatar img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 20px;
}

.account-details {
    flex-grow: 1;
}

.account-name {
    font-size: 24px;
    margin-bottom: 10px;
}

.account-email {
    font-size: 18px;
    color: #666;
}

.account-actions {
    margin-top: 20px;
}

.btn {
    display: inline-block;
    padding: 15px 30px;
    font-weight: bold;
    border-radius: 5px;
    text-align: center;
    text-decoration: none;
    transition: background-color 0.3s;
}

.btn-primary {
    background-color: #ff8c00;
    color: #fff;
}

.btn-secondary {
    background-color: #333;
    color: #fff;
}

.btn-danger {
    background-color: #ff0000;
    color: #fff;
}

.btn:hover {
    background-color: #444;
}

/* Footer Styles */
footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 20px 0;
}

</style>
    <header>
        <!-- ... (header content, navigation) ... -->
    </header>

    <section class="my-account">
        {% csrf_token %}
        <div class="container">
            <div class="account-card">
                <div class="account-avatar">
                    <img src="profile-pic.jpg" alt="Profile Picture">
                </div>
                <div class="account-details">
                    <h2 class="account-name">{{user.username}}</h2>
                    <p class="account-email">{{user.email}}</p>
                </div>
            </div>
            <div class="account-actions">
                <a href="#" class="btn btn-primary">Edit Profile</a>
                <a href="#" class="btn btn-secondary">Change Password</a>
                <a href="{% url 'logout' %}">Logout</a>   logout   </div>
        </div>
    </section>

    <footer>
        <!-- ... (footer content) ... -->
    </footer>
</body>
</html>
