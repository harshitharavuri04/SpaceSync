<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Registration</title>
    <style>
        body {
            background-image: url(https://kontakt.io/wp-content/uploads/2022/07/photo_6.png);
            background-size: cover;
            background-position: center;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="file"] {
            border: none;
        }

        button[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i>Register Your Workspace Today!</i></h1>
        <form method="post" enctype="multipart/form-data" action="../insertws/">
            {% csrf_token %}
            <label for="location">Workspace Location:</label>
            <select id="workspace_location" name="workspace_location">
                <option value="--SELECT YOUR LOCATION--"></option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Bengaluru">Bengaluru</option>
            </select>

            <label for="capacity">Capacity:</label>
            <input type="number" id="capacity" name="capacity" required>

            <label for="type">Type of Workspace:</label>
            <select id="workspace_type" name="workspace_type">
                <option value="--Enter the Type--"></option>
                <option value="meeting_hall">Meeting Hall</option>
                <option value="cabin">Cabin</option>
            </select>

            <label for="Days">Days Available</label>
            <select id="days_available" name="days_available">
                <option value="--Enter the Type--"></option>
                <option value="Weekdays">Weekdays</option>
                <option value="Weekends">Weekends</option>
                <option value="Both Weekdays and Weekends">Both</option>
            </select>

            <label for="time_start">Start time</label>
            <input type="time" id="time_start" name="time_start" min="07:00" max="18:00" required />

            <label for="end_start">End time</label>
            <input type="time" id="end_start" name="end_start" min="07:00" max="24:00" required />

            <label for="price">Price per Hour:</label>
            <input type="number" id="price" name="price" required>

            <label for="features">Additional Features:</label>
            <input type="text" id="features" name="features">

            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
